
name: Flutter CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  repository-check:
    name: Repository Setup Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check repository structure
        run: |
          echo "Checking repository..."
          test -f README.md
          test -f CONTRIBUTING.md
          echo "Repository setup is successful."

      - name: Check Flutter project availability
        run: |
          if [ -f pubspec.yaml ]; then
            echo "Flutter project found. Flutter checks can be enabled."
          else
            echo "Flutter project not created yet. Flutter checks are skipped."
          fi
