# Smart Auto Care CI
name: Smart Auto Care CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository Setup Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check repository folders
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d mobile_app
          test -d backend
          test -d web
          test -d database
          test -d docs
          echo "Repository structure is correct."

  flutter-checks:
    name: Flutter Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: flutter pub get

      - name: Check Dart formatting
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter code
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: flutter analyze

      - name: Run Flutter tests
        if: hashFiles('mobile_app/test/**/*_test.dart') != ''
        working-directory: mobile_app
        run: flutter test

  backend-checks:
    name: Backend Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: hashFiles('backend/requirements.txt') != ''
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend Python syntax
        if: hashFiles('backend/**/*.py') != ''
        working-directory: backend
        run: python -m compileall -q .

      - name: Run backend tests
        if: hashFiles('backend/**/test_*.py', 'backend/**/*_test.py') != ''
        working-directory: backend
        run: |
          pip install pytest
          python -m pytest

  website-checks:
    name: Website Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install website dependencies
        if: hashFiles('web/requirements.txt') != ''
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check website Python syntax
        if: hashFiles('web/**/*.py') != ''
        working-directory: web
        run: python -m compileall -q .

      - name: Run website Django system check
        if: hashFiles('web/manage.py') != ''
        working-directory: web
        run: python manage.py check

      - name: Run website tests
        if: hashFiles('web/**/test_*.py', 'web/**/*_test.py') != ''
        working-directory: web
        run: |
          pip install pytest
          python -m pytest

  report:
    name: CI Results
    runs-on: ubuntu-latest
    needs:
      - repository-check
      - flutter-checks
      - backend-checks
      - website-checks
    if: always()
    steps:
      - name: Show results
        run: |
          echo "## Smart Auto Care CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ needs.repository-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flutter | ${{ needs.flutter-checks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | ${{ needs.backend-checks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Website | ${{ needs.website-checks.result }} |" >> "$GITHUB_STEP_SUMMARY"
