
name: Smart Auto Care CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checks:
    name: Code Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check repository files
        id: repository
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d mobile_app
          test -d backend
          test -d web
          test -d database
          test -d docs

      - name: Set up Flutter
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: flutter pub get

      - name: Check Flutter formatting
        id: flutter-format
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter code
        id: flutter-analyze
        if: hashFiles('mobile_app/pubspec.yaml') != ''
        working-directory: mobile_app
        run: flutter analyze

      - name: Run Flutter tests
        id: flutter-tests
        if: hashFiles('mobile_app/pubspec.yaml') != '' && hashFiles('mobile_app/test/**/*_test.dart') != ''
        working-directory: mobile_app
        run: flutter test

      - name: Set up Python
        if: hashFiles('backend/requirements.txt', 'backend/**/*.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        if: hashFiles('backend/requirements.txt') != ''
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        id: python-syntax
        if: hashFiles('backend/**/*.py') != ''
        working-directory: backend
        run: python -m compileall -q .

      - name: Report check results
        if: always()
        run: |
          {
            echo '## Smart Auto Care CI'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Repository structure | ${{ steps.repository.outcome }} |'
            echo '| Flutter formatting | ${{ steps.flutter-format.outcome }} |'
            echo '| Flutter analysis | ${{ steps.flutter-analyze.outcome }} |'
            echo '| Flutter tests | ${{ steps.flutter-tests.outcome }} |'
            echo '| Python syntax | ${{ steps.python-syntax.outcome }} |'
            echo ''
            echo 'Django tests are executed separately by Smart Auto Care Backend CI.'
            echo 'The project lead reviews the results and approves pull requests before merging.'
          } >> "$GITHUB_STEP_SUMMARY"
